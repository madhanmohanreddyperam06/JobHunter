<div class="auth-page-wrapper">
  <div class="auth-card-container">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center brand-icon-gem mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.4rem;">
        ◈
      </div>
      <h1 class="h4 fw-bold text-dark mb-1">JOB COMMAND CENTER</h1>
      <p class="text-slate-muted small mb-0">Personal Job-Search Operating System</p>
    </div>

    <!-- Login Card -->
    <div class="card bg-slate-card p-4 p-sm-5 shadow-sm">
      <div class="mb-4 text-center">
        <h2 class="h5 fw-bold text-dark mb-1">Welcome Back</h2>
        <p class="text-slate-muted small mb-0">Sign in to access your command center pipeline</p>
      </div>

      <!-- Error Alert Message -->
      <div class="alert alert-danger d-flex align-items-center gap-2 small py-2 px-3 mb-3" role="alert" ng-if="vm.errorMessage">
        <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
        <div>{{ vm.errorMessage }}</div>
      </div>

      <!-- Login Form -->
      <form name="loginForm" ng-submit="vm.submitLogin(loginForm)" novalidate>
        <!-- Email Field -->
        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary" for="loginEmail">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0">
              <i class="bi bi-envelope"></i>
            </span>
            <input type="email" 
                   id="loginEmail" 
                   name="email" 
                   class="form-control border-start-0" 
                   placeholder="you@example.com" 
                   ng-model="vm.credentials.email" 
                   required
                   ng-class="{ 'is-invalid': loginForm.$submitted && loginForm.email.$invalid }"
                   autocomplete="username">
          </div>
          <div class="invalid-feedback d-block small" ng-if="loginForm.$submitted && loginForm.email.$invalid">
            Please provide a valid email address.
          </div>
        </div>

        <!-- Password Field -->
        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label small fw-semibold text-secondary mb-0" for="loginPassword">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0">
              <i class="bi bi-lock"></i>
            </span>
            <input type="password" 
                   id="loginPassword" 
                   name="password" 
                   class="form-control border-start-0" 
                   placeholder="••••••••" 
                   ng-model="vm.credentials.password" 
                   required
                   ng-class="{ 'is-invalid': loginForm.$submitted && loginForm.password.$invalid }"
                   autocomplete="current-password">
          </div>
          <div class="invalid-feedback d-block small" ng-if="loginForm.$submitted && loginForm.password.$invalid">
            Password is required.
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" 
                class="btn btn-command-primary w-100 py-2 justify-content-center fw-bold" 
                ng-disabled="vm.isLoading">
          <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true" ng-if="vm.isLoading"></span>
          <span>{{ vm.isLoading ? 'Signing In...' : 'Sign In' }}</span>
        </button>
      </form>

      <!-- Footer / Switch to Register -->
      <div class="mt-4 pt-3 border-top text-center">
        <span class="text-slate-muted small">Don't have an account?</span>
        <a href="#/register" class="small fw-semibold text-primary ms-1">Create Account</a>
      </div>
    </div>
  </div>
</div>
