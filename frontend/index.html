<!DOCTYPE html>
<html lang="en" ng-app="jobCommandCenter">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Job Application Command Center</title>
  <meta name="description" content="Personal job-search operating system built with AngularJS 1.8.x and Bootstrap 5">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◈</text></svg>">

  <!-- Bootstrap 5 CSS (CDN with local fallback) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons (CDN with local fallback) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css">

  <!-- Core Theme Stylesheets -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>

  <!-- Main Application Shell -->
  <div class="app-shell" ng-class="{ 'sidebar-open': sidebarOpen, 'auth-mode': isAuthPage() }">

    <!-- Reusable Navbar Component (Hidden on Login/Register) -->
    <div class="app-navbar-container" ng-if="!isAuthPage()">
      <app-navbar></app-navbar>
    </div>

    <!-- Application Body (Sidebar + Dynamic View Content) -->
    <div class="app-body" ng-class="{ 'h-100': isAuthPage() }">
      <!-- Mobile Backdrop -->
      <div class="sidebar-backdrop" ng-click="closeSidebar()" aria-hidden="true" ng-if="!isAuthPage()"></div>

      <!-- Reusable Sidebar Component (Hidden on Login/Register) -->
      <aside class="app-sidebar-container" aria-label="Application Sidebar" ng-if="!isAuthPage()">
        <app-sidebar></app-sidebar>
      </aside>

      <!-- Main Content Area Rendered by ngRoute -->
      <main class="app-main-content" id="mainContent" role="main" ng-class="{ 'p-0': isAuthPage() }">
        <div ng-view autoscroll="true"></div>
      </main>
    </div>

  </div>

  <!-- Vendor Scripts (AngularJS 1.8.x + ngRoute + Bootstrap 5) -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script>window.angular || document.write('<script src="node_modules/angular/angular.min.js"><\/script>')</script>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>
  <script>try { angular.module('ngRoute'); } catch(e) { document.write('<script src="node_modules/angular-route/angular-route.min.js"><\/script>'); }</script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>window.bootstrap || document.write('<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"><\/script>')</script>

  <!-- SortableJS (CDN with local fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script>window.Sortable || document.write('<script src="node_modules/sortablejs/Sortable.min.js"><\/script>')</script>

  <!-- Application Module Core -->
  <script src="app/app.js"></script>
  <script src="app/routes.js"></script>

  <!-- Filters -->
  <script src="app/filters/status.filter.js"></script>

  <!-- Services -->
  <script src="app/services/auth.service.js"></script>
  <script src="app/services/auth-interceptor.service.js"></script>
  <script src="app/services/application.service.js"></script>
  <script src="app/services/interview.service.js"></script>
  <script src="app/services/task.service.js"></script>
  <script src="app/services/resume.service.js"></script>
  <script src="app/services/job-description.service.js"></script>
  <script src="app/services/analytics.service.js"></script>
  <script src="app/services/skill.service.js"></script>

  <!-- Directives -->
  <script src="app/directives/status-badge.directive.js"></script>
  <script src="app/directives/priority-badge.directive.js"></script>
  <script src="app/directives/job-card.directive.js"></script>
  <script src="app/directives/kanban-sortable.directive.js"></script>

  <!-- Components -->
  <script src="app/components/navbar/navbar.component.js"></script>
  <script src="app/components/sidebar/sidebar.component.js"></script>
  <script src="app/components/stat-card/stat-card.component.js"></script>

  <!-- Controllers -->
  <script src="app/controllers/login.controller.js"></script>
  <script src="app/controllers/register.controller.js"></script>
  <script src="app/controllers/dashboard.controller.js"></script>
  <script src="app/controllers/applications.controller.js"></script>
  <script src="app/controllers/kanban.controller.js"></script>
  <script src="app/controllers/interviews.controller.js"></script>
  <script src="app/controllers/tasks.controller.js"></script>
  <script src="app/controllers/resumes.controller.js"></script>
  <script src="app/controllers/job-descriptions.controller.js"></script>
  <script src="app/controllers/analytics.controller.js"></script>
  <script src="app/controllers/settings.controller.js"></script>
  <script src="app/controllers/skills.controller.js"></script>

</body>
</html>
